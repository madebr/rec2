name: 'Run reccmp'
description: 'Run reccmp'
inputs:
  root-repo:
    description: 'Repository of the reference project (e.g. project-organization/project-name)'
    required: true
  root-branch:
    description: 'Main branch of the reference project (e.g. master)'
    required: true
  gist-repo:
    description: 'Gist repository where progress is stored (e.g. project-organization/1234567890abcdef1234567890abcdef)'
    required: true
  targets:
    description: 'Reccmp targets (space delimiter)'
    required: true
  symbol-counts: # FIXME: remove once reccmp supports symbol count in reccmp-project.yml
    description: 'Symbol count (space delimiter)'
    required: true
  reccmp-version:
    description: 'Reccmp version (empty for latest, skip for disabling installation)'
    default: ''
  original-search-path:
    descriptoin: 'Location of original binaries'
    default: ''
  working-directory:
    description: 'Directory of reccmp-build.yml'
    default: '${{ github.workspace }}'
  token:
    description: 'GitHub API token'
    default: ${{ github.token }}
  gist-token:
    description: 'GitHub gist token (used for pushing updates)'
    default: ${{ github.token }}
  comment-payload-path:
    description: 'Where to store commit message'
    default: ''
runs:
  using: 'composite'
  steps:
    - name: 'Setup python'
      uses: actions/setup-python@main
      if: ${{ inputs.reccmp-version != 'skip' }}
      with:
        python-version: '3.x'
    - name: 'Install reccmp'
      if: ${{ inputs.reccmp-version != 'skip' }}
      shell: sh
      run: |
        python -m pip -q install "reccmp${{ (inputs.reccmp-version != '' && format('=={0}', inputs.reccmp-version)) || '' }}"
    - name: 'Calculate variables'
      id: calc
      shell: python
      run: |
        import os
        import re
        import subprocess

        runner_temp = """
        ${{ runner.temp }}
        """.strip()

        safe_comment_payload_path = """
        ${{ inputs.comment-payload-path }}
        """.strip().replace("\\", "/")

        gist_repo = """
        ${{ inputs.gist-repo }}
        """.strip()
        gist_owner, gist_hash = gist_repo.split("/", 1)

        targets_str = """
        ${{ inputs.targets }}
        """.strip()
        targets = re.split(r"\s+", targets_str)
        symbol_counts_str = """
        ${{ inputs.symbol-counts }}
        """.strip()
        symbol_counts = [int(v) for v in re.split(r"\s+", symbol_counts_str)]

        if len(targets) != len(symbol_counts):
          raise ValueError(f"Number of targets is not equal to number of symbols: targets={','.join(targets)}, symbols={','.join(str(v) for v in symbol_counts)}")

        for target, symbol_count in zip(targets, symbol_counts):
          with open(os.environ["GITHUB_ENV"], "a") as github_env:
            print(f"{target}_SYMBOL_COUNT={symbol_count}", file=github_env)

        match "${{ runner.os }}":
          case "Windows":
            unix_temp_path = subprocess.check_output(["cygpath", "-u", runner_temp], text=True).strip()
          case _:
            unix_temp_path = runner_temp
        safe_temp_path = runner_tep.replace("\\", "/")
        safe_comment_payload_path = comment_payload_path.replace("\\", "/")

        with open(os.environ["GITHUB_OUTPUT"], "a") as github_output:
          print(f"unix-temp-path={unix_temp_path}", file=github_output)
          print(f"safe-temp-path={safe_temp_path}", file=github_output)
          print(f"gist-hash={gist_hash}", file=github_output)
          print(f"comment-payload-path={safe_comment_payload_path}", file=github_output)
    - name: 'Fetch previous jsons'
      shell: sh
      run: |
        for target in ${{ inputs.targets }}; do
          curl -fLSs -o "${{ steps.calc.outputs.unix-temp-path }}/${target}-old.json" https://gist.githubusercontent.com/${{ inputs.gist-repo }}/raw/${target}.json
        done
    - name: 'Detect originals'
      if: ${{ inputs.original-search-path != '' }}
      shell: sh
      run : |
        reccmp-project detect --what original --search-path '${{ inputs.original-search-path }}'
    - name: 'Compare progress with previous'
      shell: sh
      run: |
        ${{ (inputs.working-directory && format('cd "{0}"', inputs.working-directory)) || '' }}
        for target in ${{ inputs.targets }}; do
          reccmp-reccmp --no-color --target ${target} \
            --diff "${{ steps.calc.outputs.unix-temp-path }}/${target}-old.json" \
            --json "${{ steps.calc.outputs.unix-temp-path }}/${target}.json" \
            --json-diet \
            -T "${${target}_SYMBOL_COUNT}" \
            -H "${{ steps.calc.outputs.unix-temp-path }}/${target}.html" \
            -S "${{ steps.calc.outputs.unix-temp-path }}/${target}.svg" \
            >${{ steps.calc.outputs.unix-temp-path }}/${target}.txt
        done
    - name: 'Update gist'
      if: ${{ inputs.gist-token != '' && github.event_name == 'push' && github.repository == inputs.root-repo && github.event.ref == format('refs/heads/{0}', inputs.root-branch) }}
      uses: actions/github-script@main
      with:
        github-token: ${{ inputs.gist-token }}
        script: |
          fs = require('fs');
          process = require('process');
          const commit_info = {
            repo: '${{ github.repository }}',
            branch: '${{ github.ref }}',
            sha: '${{ github.sha }}',
          };
          targets = "${{ inputs.targets }}".split(/(\s+)/).filter( function(e) { return e.trim().length > 0; } );
          upload_gist_files = {
            'commit.json': { content: JSON.stringify(commit_info), },
          };
          targets.forEach((target) => {
            upload_gist_files[`${target}.json`] = { content: fs.readFileSync(`${{ steps.calc.outputs.safe-temp-path }}/${target}.json`, 'utf8'),  };
            upload_gist_files[`${target}.svg`] =  { content: fs.readFileSync(`${{ steps.calc.outputs.safe-temp-path }}/${target}.svg`,  'utf8'),  };
            upload_gist_files[`${target}.html`] = { content: fs.readFileSync(`${{ steps.calc.outputs.safe-temp-path }}/${target}.html`, 'utf8'),  };
            upload_gist_files[`${target}.txt`] =  { content: fs.readFileSync(`${{ steps.calc.outputs.safe-temp-path }}/${target}.txt`,  'utf8'),  };
          });
          await github.rest.gists.update({
            gist_id: '${{ steps.calc.outputs.gist-hash }}',
            files: upload_gist_files,
          });
    - name: 'Show progress'
      shell: sh
      run:
        for target in ${{ inputs.targets }}; do
          echo "target ${target}"
          cat "${{ steps.calc.outputs.unix-temp-path }}/${target}.txt"
          echo "========"
        done
    - name: 'Create comment payload'
      if: ${{ github.event_name == 'pull_request' }}
      shell: sh
      env:
        GH_TOKEN: ${{ inputs.token }}
      run: |
        payload_path="${{ steps.calc.outputs.comment-payload-path }}"
        echo "# reccmp report" >>${payload_path}
        for target in ${{ inputs.targets }} do
          echo "## ${target}" >>${payload_path}
          echo '```' >>${payload_path}
          cat ${{ steps.calc.outputs.unix-temp-path }}/${target}.txt >>${payload_path}
          echo '```' >>${payload_path}
        done
